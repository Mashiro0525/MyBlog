# Sveltia CMS 配置
# 作用：在网页上编辑 pkm_cards_v2/主题/子主题.md，保存即 commit 回 main，
#       触发 GitHub Actions 重新生成博客并发布到 GitHub Pages。
#
# 登录方式：Sveltia 内置 GitHub Device Flow
#   1) 进入 https://Mashiro0525.github.io/MyBlog/admin/
#   2) 点击「Log in with GitHub」
#   3) 弹窗显示一段授权码（形如 ABCD-EFGH），复制后访问 https://github.com/login/device 粘贴
#   4) 在 GitHub 页面授权本仓库的写权限，回来即登录成功
#   5) 后续 7 天内免重复登录（token 存浏览器）
#
# 优点：完全无需 OAuth 代理、client_secret、任何后端服务。GitHub Pages 纯静态即可。
# 要求：你登录的 GitHub 账号必须对 Mashiro0525/MyBlog 有写权限（owner 即可）。

backend:
  name: github
  repo: Mashiro0525/MyBlog
  branch: main

# 媒体文件存放（卡片目前为纯文本 md，基本用不到，保留以防图片上传）
media_folder: "pkm_cards_v2/uploads"
public_folder: "/pkm_cards_v2/uploads"

# 6 个主题，各自一个 folder collection
# 每个子主题 .md 文件作为一条 entry，编辑其完整 markdown 内容（保存后由 Actions 重新生成博客）
collections:
  - name: "blueprint"
    label: "蓝图交互"
    folder: "pkm_cards_v2/蓝图交互"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

  - name: "gis"
    label: "GIS坐标"
    folder: "pkm_cards_v2/GIS坐标"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

  - name: "cpp"
    label: "Cpp工程"
    folder: "pkm_cards_v2/Cpp工程"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

  - name: "airsim"
    label: "AirSim无人机"
    folder: "pkm_cards_v2/AirSim无人机"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

  - name: "echarts"
    label: "Echarts媒体"
    folder: "pkm_cards_v2/Echarts媒体"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

  - name: "config"
    label: "项目配置"
    folder: "pkm_cards_v2/项目配置"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: body, label: "Markdown 内容", widget: "markdown" }

