name: Build and Deploy Blog

# 触发：推送到 main，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 权限（deploy-pages 需要 pages:write）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate blog (build_blog.py)
        run: python build_blog.py

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp -r pkm_blog/* _site/
          cp -r admin _site/admin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
